[project]
name = "difflob"
version = "0.1.0"
description = "Diffusion models for controllable and counterfactual limit order book generation."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "einops",
    "matplotlib",
    "numpy",
    "opt-einsum",
    "pandas",
    "pyyaml",
    "pytorch-lightning",
    "scipy",
    "seaborn",
    "torch",
    "tqdm",
    "wandb",
]

[project.scripts]
difflob-diffusion = "difflob.cli.entrypoints:diffusion"
difflob-gan = "difflob.cli.entrypoints:gan"
difflob-vae = "difflob.cli.entrypoints:vae"
difflob-autoregressive = "difflob.cli.entrypoints:autoregressive"
difflob-build-conditions = "difflob.cli.entrypoints:build_conditions"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/difflob"]

[tool.uv]
package = true
